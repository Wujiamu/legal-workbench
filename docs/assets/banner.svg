<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="素章 · PlainFolio">
  <defs>
    <linearGradient id="sz-bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="220">
      <stop offset="0%" stop-color="#17181b" />
      <stop offset="100%" stop-color="#222429" />
    </linearGradient>
    <pattern id="sz-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3a3d44" stroke-width="0.6" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="960" height="220" rx="14" fill="url(#sz-bg)" />
  <rect width="960" height="220" rx="14" fill="url(#sz-grid)" />

  <!-- Subtle archival inner rule -->
  <rect x="20" y="18" width="920" height="184" rx="10" fill="none" stroke="#ded9cf" stroke-opacity="0.18" stroke-width="1" />

  <!-- Logo C · 编简成章 -->
  <g transform="translate(46, 54) scale(0.185)">
    <rect x="20" y="20" width="472" height="472" rx="106" fill="#1b1c1f" stroke="#575a63" stroke-width="12" />
    <rect x="120" y="106" width="74" height="300" rx="15" fill="#f6f3ec" />
    <rect x="219" y="138" width="74" height="268" rx="15" fill="#f6f3ec" fill-opacity="0.91" />
    <rect x="318" y="118" width="74" height="288" rx="15" fill="#f6f3ec" fill-opacity="0.82" />
    <rect x="94" y="234" width="324" height="54" rx="13" fill="#a34b42" />
    <circle cx="157" cy="261" r="9.5" fill="#f6f3ec" />
    <circle cx="256" cy="261" r="9.5" fill="#f6f3ec" />
    <circle cx="355" cy="261" r="9.5" fill="#f6f3ec" />
  </g>

  <!-- Title & subtitle -->
  <text x="162" y="88" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#f6f3ec" letter-spacing="1.5">素章 · PlainFolio</text>
  <text x="162" y="122" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" fill="#d2cec5">把整套诉讼案卷留在你自己的电脑里 —— 整理、查页、画图、算账、一键装卷</text>

  <!-- Feature pills: 低饱和青黛蓝 & 古印泥 -->
  <g transform="translate(162, 146)" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="152" height="30" rx="15" fill="#233742" stroke="#5b879e" stroke-opacity="0.55" />
    <text x="76" y="20" text-anchor="middle" fill="#eaf0f4">100% 本地离线不联网</text>

    <rect x="164" y="0" width="160" height="30" rx="15" fill="#322221" stroke="#b96d64" stroke-opacity="0.55" />
    <text x="244" y="20" text-anchor="middle" fill="#f4dfdc">法院标准一键自动装卷</text>

    <rect x="336" y="0" width="174" height="30" rx="15" fill="#233742" stroke="#5b879e" stroke-opacity="0.55" />
    <text x="423" y="20" text-anchor="middle" fill="#eaf0f4">Mac / Windows 双端共用</text>

    <rect x="522" y="0" width="144" height="30" rx="15" fill="#2a2b30" stroke="#9e998e" stroke-opacity="0.55" />
    <text x="594" y="20" text-anchor="middle" fill="#f5f3ee">五套素系配色随心切换</text>

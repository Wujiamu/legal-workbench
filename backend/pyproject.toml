[project]
name = "legal-workbench"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.1",
  "fastapi==0.115.12",
  "httpx>=0.28.1",
  "mcp>=1.30.0",
  "openpyxl>=3.1.5",
  "pillow>=13.0.0",
  "plainfolio-dossier",
  "plainfolio-parse[ocr]",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
  "pypdf>=5.0.0",
  "pypdfium2>=5.15.2",
  "python-docx>=1.2.0",
  "rapidocr-onnxruntime>=1.4.4",
  "reportlab>=5.1.0",
  "sqlalchemy==2.0.41",
  "uvicorn==0.34.3",
]

[tool.uv.sources]
# 仓库内第一方独立包：以可编辑方式引用，`backend/.venv` 布局与安装入口保持不变。
plainfolio-dossier = { path = "../packages/plainfolio-dossier", editable = true }
plainfolio-parse = { path = "../packages/plainfolio-parse", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
lwb-cli = "legal_workbench.cli:main"
lwb-mcp = "legal_workbench.mcp_server:main"
lwb-doctor = "legal_workbench.doctor:main"
lwb-desktop = "legal_workbench.desktop_launcher:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
]
